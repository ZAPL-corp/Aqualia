<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aqualia</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <div class="ambient ambient-three"></div>

  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 2.8C9.3 6.7 5.6 10.3 5.6 14.4a6.4 6.4 0 0 0 12.8 0C18.4 10.3 14.7 6.7 12 2.8Z"/><path d="M8.7 15.1a3.3 3.3 0 0 0 3.1 3.1"/></svg>
        </div>
        <div>
          <h1>Aqualia</h1>
          <span class="brand-subtitle">BROWSER CARE</span>
        </div>
      </div>
      <span class="version">1.0.110</span>
    </header>

    <section class="status-card">
      <div class="status-orb"><span></span></div>
      <div class="status-copy">
        <span class="eyebrow">СИСТЕМА ЗАЩИТЫ</span>
        <h2 id="protection-title">Защита отключена</h2>
        <p id="protection-subtitle">Реклама может загружаться</p>
      </div>
      <label class="switch" aria-label="Включить блокировку рекламы">
        <input type="checkbox" id="toggle-adblock">
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </label>
    </section>

    <div class="section-heading">
      <span>ИНСТРУМЕНТЫ</span>
      <span class="section-line"></span>
    </div>

    <main class="actions">
      <button class="action-card" id="btn-quick-clean">
        <span class="action-icon cyan">
          <svg viewBox="0 0 24 24"><path d="M4 20h16M7 16l2-9 3-3 3 3 2 9M9 11h6M10 16v-2m4 2v-2"/></svg>
        </span>
        <span class="action-copy"><strong>Быстрая очистка</strong><small>Удалить историю посещений</small></span>
        <svg class="chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
      </button>

      <button class="action-card" id="btn-ram-freeze">
        <span class="action-icon violet">
          <svg viewBox="0 0 24 24"><path d="M9 3v3m6-3v3M9 18v3m6-3v3M3 9h3m-3 6h3m12-6h3m-3 6h3M7 7h10v10H7z"/><path d="m10 10 4 4m0-4-4 4"/></svg>
        </span>
        <span class="action-copy"><strong>RAM Freeze</strong><small>Выгрузить фоновые вкладки</small></span>
        <svg class="chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
      </button>

      <button class="action-card danger-action" id="btn-danger-zone">
        <span class="action-icon coral">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
        </span>
        <span class="action-copy"><strong>Полная очистка</strong><small>История, cookies, кэш и данные форм</small></span>
        <svg class="chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </main>

    <div class="feedback" id="status-message" role="status" aria-live="polite">
      <span class="feedback-dot"></span>
      <span id="status-text">Aqualia готова к работе</span>
    </div>

    <footer class="footer">
      <span>DESIGNED FOR FOCUS</span>
      <button id="btn-github" class="github-button" aria-label="Открыть GitHub">
        <svg viewBox="0 0 24 24"><path d="M12 .9a11.1 11.1 0 0 0-3.5 21.6c.6.1.8-.3.8-.6v-2.1c-3.3.7-4-1.4-4-1.4-.5-1.3-1.3-1.6-1.3-1.6-1.1-.8.1-.8.1-.8 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.6-.3-5.3-1.3-5.3-5.8 0-1.3.5-2.3 1.2-3.2-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.4 11.4 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.7 1.6.3 2.8.2 3.1.8.9 1.2 1.9 1.2 3.2 0 4.5-2.7 5.5-5.3 5.8.4.4.8 1.1.8 2.2v3.1c0 .3.2.7.8.6A11.1 11.1 0 0 0 12 .9Z"/></svg>
      </button>
    </footer>
  </div>

  <div class="modal-overlay" id="confirm-modal" aria-hidden="true">
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <div class="dialog-symbol">
        <svg viewBox="0 0 24 24"><path d="M12 3 21 20H3L12 3Z"/><path d="M12 9v5m0 3h.01"/></svg>
      </div>
      <h2 id="dialog-title">Полная очистка?</h2>
      <p>Будут удалены история, cookies, кэш и данные форм. Вы выйдете из некоторых сайтов. Сохранённые пароли не затрагиваются.</p>
      <div class="dialog-actions">
        <button class="button-secondary" id="modal-cancel">Отмена</button>
        <button class="button-danger" id="modal-confirm">Очистить</button>
      </div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
